<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<title>Scripts</title>
<style>
  :root{--bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:#232836;--text:#eceef4;--mute:#8a92a6;--acc:#7c5cff;--acc2:#b39bff;--ok:#34d399;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:22px 18px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .primary{background:linear-gradient(135deg,var(--acc),#9a6bff);border:0;color:#fff}
  select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;outline:none}
  textarea{width:100%;min-height:70px;resize:vertical}
  .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .opts label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
  /* idea cards: neon icon, name, one-line hook */
  .ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:14px 0 0}
  .idea{--n:var(--acc,#00e5ff);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;
    background:linear-gradient(135deg,color-mix(in srgb,var(--n) 10%,transparent),transparent 70%),var(--panel2);border:1px solid color-mix(in srgb,var(--n) 35%,var(--line));
    color:var(--text);padding:10px 12px;font:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:transform .15s,border-color .15s,box-shadow .15s}
  .idea .ic{grid-row:span 2;width:22px;height:22px;color:var(--n);filter:drop-shadow(0 0 6px var(--n))}
  .idea b{font-family:var(--font-ui,Rajdhani,sans-serif);font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--n);line-height:1.2}
  .idea small{color:var(--mute);font-size:12px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .idea{align-items:start}.idea .ic{align-self:center}
  .idea:active{transform:scale(.97)}
  @media(hover:hover){.idea:hover{transform:translateY(-2px);border-color:var(--n);box-shadow:0 0 18px -6px var(--n)}}
  .idea:focus-visible{outline:2px solid var(--n);outline-offset:2px}
  @media(max-width:520px){.ideas{grid-template-columns:1fr 1fr}.idea{padding:10px}.idea .ic{width:20px;height:20px}.idea b{font-size:14px}}
  .ideas-head{display:flex;align-items:center;gap:8px;margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line)}
  .ideas-head button{background:none;border:0;color:var(--text);font:600 14px/1 var(--font-ui,Rajdhani,sans-serif);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;padding:8px 4px;cursor:pointer;min-height:36px}
  .ideas-head .ic{width:16px;height:16px}
  #ideasTog .ic{transition:transform .2s;transform:rotate(90deg)}
  #ideasTog[aria-expanded="false"] .ic{transform:rotate(0)}
  #ideasTog .n{color:var(--mute);font-weight:500;letter-spacing:.04em}
  #shuffle{margin-left:auto;color:var(--acc,#00e5ff)}
  #shuffle .ic{transition:transform .3s}#shuffle:active .ic{transform:rotate(180deg)}
  .ideas{margin-top:6px}
  .ideas[hidden],#shuffle[hidden]{display:none}
  .ideas .idea{animation:idea-in .3s both}
  @keyframes idea-in{from{opacity:0;transform:translateY(6px)}}
  @media(prefers-reduced-motion:reduce){.ideas .idea{animation:none}}
  .chat{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
  .msg{padding:12px 14px;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
  .msg.user{align-self:flex-end;max-width:85%;background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.4)}
  .msg.assistant{background:var(--panel)}
  .msg .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;white-space:normal}
  .msg .tools .btn{padding:6px 10px;font-size:12px}
  .msg.thinking{color:var(--mute);font-style:italic}
  /* the app's theme font for the conversation */
  .msg{font-family:var(--font-ui,Rajdhani,Inter,sans-serif);font-size:16.5px;font-weight:500;letter-spacing:.01em}
  .msg.assistant .txt{display:inline}
  .msg.typing .txt::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--acc,#7c5cff);animation:caret .8s steps(1) infinite}
  .msg.typing{cursor:pointer}
  @keyframes caret{50%{opacity:0}}
  .msg.thinking::after{content:"";display:inline-block;width:.55em;height:1em;margin-left:4px;vertical-align:-.1em;background:var(--acc,#7c5cff);animation:caret .8s steps(1) infinite}
  .compose{background:var(--bg);padding-top:6px}
  .compose .row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .compose .row .meta{flex:1;font-size:12px;color:var(--mute)}
  .err{color:var(--err);font-size:13px;margin-top:6px}
  .empty{color:var(--mute);font-size:13px;padding:4px 2px}
</style>
<link rel="stylesheet" href="/app.css">
<script src="/studio.js"></script>
<script src="/icons.js"></script>
</head>
<body data-title="Scripts" data-sub="Suspense scripts with real hooks.">
<div class="wrap">
  <div class="panel">
    <div class="opts">
      <label>Length<select id="len"><option value="30">30 s</option><option value="60" selected>60 s</option><option value="90">90 s</option></select></label>
      <label>Format<select id="fmt"><option value="narrated">Narrated story</option><option value="pov">POV to camera</option><option value="dialogue">Scene with dialogue</option></select></label>
      <button class="btn" id="clear" type="button" style="margin-left:auto"><svg class=ic aria-hidden=true><use href=#i-refresh></use></svg> New chat</button>
    </div>
    <div class="ideas-head"><button type="button" id="ideasTog" aria-expanded="true" aria-controls="starters"><svg class=ic aria-hidden=true><use href=#i-chevron></use></svg> Ideas <span class="n" id="ideasN"></span></button><button type="button" id="shuffle"><svg class=ic aria-hidden=true><use href=#i-dice></use></svg> Shuffle</button></div>
    <div class="ideas" id="starters" aria-label="Ideas to start"></div>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="compose">
    <textarea id="input" aria-label="Your message" placeholder="What should the story be about? e.g. a night-shift guard keeps seeing the same visitor on camera"></textarea>
    <div class="row"><span class="meta" id="meta">About 1 cent per reply.</span><button class="btn primary" id="send" type="button"><svg class=ic aria-hidden=true><use href=#i-pen></use></svg> Write</button></div>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// [icon, name, one-line hook, prompt]. Six random ones are shown at a time, so every visit (and every user) gets a different set.
const IDEAS=[
  ['moon','Night shift','Something walks in at 3 AM','Write a horror story about something that happens on a night shift, with a twist at the end.'],
  ['target','True crime','One detail nobody noticed','Write a mystery told like a true-crime story about one small detail nobody noticed.'],
  ['alert','Broken rule','"Never open the door after 2"','Write a story that opens with a strange rule the narrator broke.'],
  ['zap','Sci-fi twist','The last line flips it all','Write a near-future sci-fi story where the last line changes everything.'],
  ['brain','Mind game','Trust no narrator','Write a psychological thriller where the narrator slowly realises they are the one being watched.'],
  ['sparkles','5 ideas first','Hooks to pick from','Give me 5 suspense story ideas with a hook each.'],
  ['camera','Found footage','The last file on the camera','Write a story told through the last video found on a missing hiker camera.'],
  ['mic','Voicemail','A message from tomorrow','Write a story about a voicemail from the narrator own number, dated tomorrow.'],
  ['castle','Hidden room','Not on the floor plan','Write a story about a family who finds a room in their house that is not on the floor plan.'],
  ['waves','Deep sea','Something answers the sonar','Write a deep-sea suspense story where something answers the submarine sonar.'],
  ['hourglass','Time loop','Same day, one change','Write a time-loop story where the narrator notices one thing is different every loop.'],
  ['user','Doppelganger','Someone is living your life','Write a story where the narrator finds someone else living their life, and everyone believes them.'],
  ['lock','Locked room','No way in, no way out','Write a locked-room mystery with a clue hidden in the first line.'],
  ['footprints','Lost hiker','Tracks that just stop','Write a story about footprints in the snow that stop in the middle of a field.'],
  ['link','Online stranger','The account knows too much','Write a story about an online stranger who knows things nobody was ever told.'],
  ['heart','Dark romance','The perfect match is lying','Write a suspense story about a perfect first date where one small lie unravels everything.'],
  ['flame','Urban legend','The street everyone avoids','Write a story about the urban legend every local in a small town refuses to talk about.'],
  ['gem','Heist gone wrong','One of the crew is a fake','Write a heist story where the crew realises one of them is not who they say.'],
  ['hand','Last confession','A deathbed secret','Write a story about a deathbed confession that changes how the narrator sees their whole family.'],
  ['wind','Small town','Everyone leaves at sunset','Write a story about a town where everyone goes inside at sunset, and a newcomer who does not.'],
  ['video','Livestream','Chat sees what they cannot','Write a story about a livestream where the chat sees something behind the streamer.'],
  ['dice','The game','You cannot quit','Write a story about a game that a group of friends cannot stop playing.'],
  ['coffee','Roommate','The new one never sleeps','Write a story about a new roommate who never seems to sleep.'],
  ['wrench','Smart home','The house stops listening','Write a story where a smart home slowly stops obeying its owner.'],
  ['person','Missing poster','The face is yours','Write a story where the narrator sees a missing-person poster with their own face on it.'],
  ['surprised','Kid drawing','It draws what comes next','Write a story about a child whose drawings show things before they happen.'],
  ['help','Survival','One rule kept them alive','Write a survival story built around a single rule that kept everyone alive.'],
  ['clapper','Cold open','Start in the chaos','Write a story that opens in the middle of the most tense moment, then explains how we got there.'],
];
const NEON=['#b18cff','#ff4d6d','#ffb020','#00e5ff','#ff7ad9','#c6ff00'];
let shown=[];
function dealIdeas(){
  // 6 random ideas, none from the set on screen now
  const pool=IDEAS.map((_,i)=>i).filter(i=>!shown.includes(i));
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  shown=pool.slice(0,6);
  $('starters').innerHTML=shown.map((k,p)=>{ const [i,l,h]=IDEAS[k]; return `<button type="button" class="idea" style="--n:${NEON[p]};animation-delay:${p*40}ms" data-k="${k}">${ic(i)}<b>${l}</b><small>${esc(h)}</small></button>`; }).join('');
}
// the list folds away; open by default until a chat starts, then the user's choice is remembered
function setIdeas(open, remember){
  $('starters').hidden=!open; $('shuffle').hidden=!open; $('ideasTog').setAttribute('aria-expanded',open);
  $('ideasN').textContent=open?'':IDEAS.length;
  if(remember) try{ localStorage.setItem('ideasOpen',open?'1':'0'); }catch{}
}
let msgs=[]; try{ msgs=JSON.parse(localStorage.getItem('scriptsChat')||'[]'); }catch{}
// copied text is plain text with normal spaces (no %20, non-breaking or zero-width spaces, no page styling)
const plain=t=>String(t).replace(/%20/g,' ').replace(/[  -   　]/g,' ').replace(/[​-‍⁠﻿]/g,'');
msgs=msgs.map(m=>({...m,content:plain(m.content)}));
document.addEventListener('copy',e=>{
  const sel=String(getSelection()||''); if(!sel||!e.clipboardData) return;
  e.clipboardData.setData('text/plain',plain(sel)); e.preventDefault();
});
// copy that works everywhere: the clipboard API first, then a hidden text box (iPhone home-screen app, in-app browsers)
async function copyText(text){
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch{}
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch{}
  ta.remove(); return ok;
}
const save=()=>{ try{ localStorage.setItem('scriptsChat',JSON.stringify(msgs.slice(-30))); }catch{} };
// only the spoken lines go to Story mode (drops the TITLE / VISUAL / TWIST labels)
function spoken(t){
  const out=[];
  for(const l of t.split('\n')){
    let m=l.match(/^\s*\**\s*HOOK[^:]*:\s*\**\s*(.+)/i); if(m){ out.push(m[1].trim()); continue; }
    m=l.match(/^\s*\[[^\]]*\]\s*(.+)/); if(m) out.push(m[1].split(/\|\s*VISUAL\s*:/i)[0].trim());
  }
  const lines=out.map(x=>x.replace(/^["“]|["”]$/g,'')).filter((x,i,a)=>x&&x!==a[i-1]);
  return lines.length?lines.join('\n'):t;
}
// the newest reply is typed out like someone writing it (a few seconds, however long it is); tap it to show it all
function typeOut(el, text){
  return new Promise(done=>{
    const body=el.querySelector('.txt'), tools=el.querySelector('.tools');
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ body.textContent=text; return done(); }
    tools.hidden=true; el.classList.add('typing');
    const per=Math.max(1,Math.ceil(text.length/400)); let i=0, stop=false;
    el.onclick=()=>{ stop=true; };
    const step=()=>{
      i=stop?text.length:Math.min(text.length,i+per);
      body.textContent=text.slice(0,i);
      if(i<text.length) return requestAnimationFrame(step);
      el.classList.remove('typing'); el.onclick=null; tools.hidden=false; done();
    };
    step();
  });
}
function render(typeLast){
  $('chat').innerHTML=msgs.length?msgs.map((m,i)=>`<div class="msg ${m.role}"><span class="txt">${typeLast&&i===msgs.length-1?'':esc(m.content)}</span>${m.role==='assistant'?`<div class="tools"><button class="btn" data-story="${i}">${ic('film')} Use in Story mode</button><button class="btn" data-copy="${i}">${ic('check')} Copy</button><button class="btn" data-more="${i}">Make it scarier</button><button class="btn" data-twist="${i}">Different twist</button></div>`:''}</div>`).join('')
    :'<div class="empty">Tap an idea or describe your own below.</div>';
}
async function send(text){
  text=(text||'').trim(); if(!text||$('send').disabled) return; $('err').textContent='';
  msgs.push({role:'user',content:text}); save(); render();
  $('chat').insertAdjacentHTML('beforeend','<div class="msg assistant thinking" id="thinking">Writing… (10-30 seconds)</div>');
  $('thinking').scrollIntoView({behavior:'smooth',block:'end'});
  $('send').disabled=true; $('input').value='';
  try{
    const r=await fetch('/api/scripts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,length:+$('len').value,format:$('fmt').value})});
    const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'The writer failed, try again.');
    j.reply=plain(j.reply); msgs.push({role:'assistant',content:j.reply}); save(); render(true);
    $('meta').textContent='Last reply cost '+(j.cost?'$'+j.cost.toFixed(4):'under a cent')+'.';
    const all=$('chat').querySelectorAll('.msg.assistant'), last=all[all.length-1];
    last?.scrollIntoView({behavior:'smooth',block:'start'});
    if(last) await typeOut(last,j.reply);
  }catch(e){ msgs.pop(); save(); render(); $('input').value=text; $('err').textContent=e.message; }
  $('send').disabled=false;
}
dealIdeas();
{ let saved=null; try{ saved=localStorage.getItem('ideasOpen'); }catch{} setIdeas(saved===null?!msgs.length:saved==='1'); }
$('ideasTog').onclick=()=>setIdeas($('starters').hidden,true);
$('shuffle').onclick=dealIdeas;
$('send').onclick=()=>send($('input').value);
$('input').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) send($('input').value); });
$('starters').onclick=e=>{ const b=e.target.closest('[data-k]'); if(b){ setIdeas(false); send(IDEAS[b.dataset.k][3]); } };
$('clear').onclick=()=>{ if(msgs.length&&!confirm('Start a new chat? This one will be cleared.')) return; msgs=[]; save(); render(); $('err').textContent=''; setIdeas(true,true); dealIdeas(); };
$('chat').onclick=async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.story){ try{ sessionStorage.setItem('scriptToStory',spoken(msgs[b.dataset.story].content)); }catch{} location.href='/story'; }
  else if(b.dataset.copy){
    const ok=await copyText(plain(msgs[b.dataset.copy].content));
    if(ok) b.innerHTML=ic('check')+' Copied';
    else { // last resort: select the reply so the phone's own Copy works
      const t=b.closest('.msg').querySelector('.txt'), r=document.createRange(); r.selectNodeContents(t);
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Selected, tap Copy';
    }
  }
  else if(b.dataset.more) send('Rewrite it scarier: more dread, a tighter ticking clock, and a nastier final twist.');
  else if(b.dataset.twist) send('Keep the setup, but give it a completely different, more surprising twist ending.');
};
try{ const o=JSON.parse(localStorage.getItem('scriptsOpts')||'{}'); if(o.len) $('len').value=o.len; if(o.fmt) $('fmt').value=o.fmt; }catch{}
['len','fmt'].forEach(id=>$(id).onchange=()=>{ try{ localStorage.setItem('scriptsOpts',JSON.stringify({len:$('len').value,fmt:$('fmt').value})); }catch{} });
render();
</script>
<script src="/app.js"></script>
</body>
</html>
