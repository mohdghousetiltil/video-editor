<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<title>Scripts</title>
<style>
  :root{--bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:#232836;--text:#eceef4;--mute:#8a92a6;--acc:#7c5cff;--acc2:#b39bff;--ok:#34d399;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:22px 18px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .primary{background:linear-gradient(135deg,var(--acc),#9a6bff);border:0;color:#fff}
  select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;outline:none}
  textarea{width:100%;min-height:70px;resize:vertical}
  .opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .opts label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
  /* idea cards: neon icon, name, one-line hook */
  .ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:14px 0 0}
  .idea{--n:var(--acc,#00e5ff);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;
    background:linear-gradient(135deg,color-mix(in srgb,var(--n) 10%,transparent),transparent 70%),var(--panel2);border:1px solid color-mix(in srgb,var(--n) 35%,var(--line));
    color:var(--text);padding:10px 12px;font:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:transform .15s,border-color .15s,box-shadow .15s}
  .idea .ic{grid-row:span 2;width:22px;height:22px;color:var(--n);filter:drop-shadow(0 0 6px var(--n))}
  .idea b{font-family:var(--font-ui,Rajdhani,sans-serif);font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--n);line-height:1.2}
  .idea small{color:var(--mute);font-size:12px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .idea{align-items:start}.idea .ic{align-self:center}
  .idea:active{transform:scale(.97)}
  @media(hover:hover){.idea:hover{transform:translateY(-2px);border-color:var(--n);box-shadow:0 0 18px -6px var(--n)}}
  .idea:focus-visible{outline:2px solid var(--n);outline-offset:2px}
  @media(max-width:520px){.ideas{grid-template-columns:1fr 1fr}.idea{padding:10px}.idea .ic{width:20px;height:20px}.idea b{font-size:14px}}
  .ideas-head{display:flex;align-items:center;gap:8px;margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line)}
  .ideas-head button{background:none;border:0;color:var(--text);font:600 14px/1 var(--font-ui,Rajdhani,sans-serif);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;padding:8px 4px;cursor:pointer;min-height:36px}
  .ideas-head .ic{width:16px;height:16px}
  #ideasTog .ic{transition:transform .2s;transform:rotate(90deg)}
  #ideasTog[aria-expanded="false"] .ic{transform:rotate(0)}
  #ideasTog .n{color:var(--mute);font-weight:500;letter-spacing:.04em}
  #shuffle{margin-left:auto;color:var(--acc,#00e5ff)}
  #shuffle .ic{transition:transform .3s}#shuffle:active .ic{transform:rotate(180deg)}
  .ideas{margin-top:6px}
  .ideas[hidden],#shuffle[hidden]{display:none}
  .ideas .idea{animation:idea-in .3s both}
  @keyframes idea-in{from{opacity:0;transform:translateY(6px)}}
  @media(prefers-reduced-motion:reduce){.ideas .idea{animation:none}}
  .chat{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
  .msg{padding:12px 14px;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
  .msg .script{white-space:normal}
  .script h3{margin:0 0 4px;font-size:19px;line-height:1.3}
  .script .gtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc,#00e5ff);border:1px solid var(--line);padding:1px 8px}
  .script h4{margin:14px 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
  .script p{margin:0 0 8px;display:flex;gap:10px}
  .script .when{flex:0 0 52px;font-size:12px;color:var(--mute);padding-top:3px}
  .script .story p{font-size:17.5px;line-height:1.55}
  .script details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .script summary{cursor:pointer;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--acc,#00e5ff);min-height:32px}
  .script .shots p{font-size:15px;color:var(--mute);margin-top:6px}
  .script .foot{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:14px;color:var(--mute)}
  .script .foot p{display:block}
  .idea small{-webkit-line-clamp:3}.idea small em{display:block;font-style:normal;color:var(--n)}
  .msg.user{align-self:flex-end;max-width:85%;background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.4)}
  .msg.assistant{background:var(--panel)}
  .msg .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;white-space:normal}
  .msg .tools .btn{padding:6px 10px;font-size:12px}
  .msg.thinking{color:var(--mute);font-style:italic}
  /* the app's theme font for the conversation */
  .msg{font-family:var(--font-ui,Rajdhani,Inter,sans-serif);font-size:16.5px;font-weight:500;letter-spacing:.01em}
  .msg.assistant .txt{display:inline}
  .msg.typing .txt::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--acc,#7c5cff);animation:caret .8s steps(1) infinite}
  .msg.typing{cursor:pointer}
  @keyframes caret{50%{opacity:0}}
  .msg.thinking::after{content:"";display:inline-block;width:.55em;height:1em;margin-left:4px;vertical-align:-.1em;background:var(--acc,#7c5cff);animation:caret .8s steps(1) infinite}
  .compose{background:var(--bg);padding-top:6px}
  .compose .row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .compose .row .meta{flex:1;font-size:12px;color:var(--mute)}
  .err{color:var(--err);font-size:13px;margin-top:6px}
  .empty{color:var(--mute);font-size:13px;padding:4px 2px}
</style>
<link rel="stylesheet" href="/app.css">
<script src="/studio.js"></script>
<script src="/icons.js"></script>
</head>
<body data-title="Scripts" data-sub="Rom-com, comedy, kids and new-gen stories.">
<div class="wrap">
  <div class="panel">
    <div class="opts">
      <label>Genre<select id="genre"><option value="mix">Mix</option><optgroup label="Main"><option value="romcom">Rom-com</option><option value="comedy">Comedy</option><option value="kids">Kids</option><option value="newgen">New gen</option></optgroup><optgroup label="More"><option value="thriller">Thriller</option><option value="suspense">Suspense / mystery</option><option value="horror">Horror</option></optgroup></select></label>
      <label>Length<select id="len"><option value="30">30 s</option><option value="60" selected>60 s</option><option value="90">90 s</option></select></label>
      <label>Format<select id="fmt"><option value="narrated">Narrated story</option><option value="pov">POV to camera</option><option value="dialogue">Scene with dialogue</option></select></label>
      <button class="btn" id="clear" type="button" style="margin-left:auto"><svg class=ic aria-hidden=true><use href=#i-refresh></use></svg> New chat</button>
    </div>
    <div class="ideas-head"><button type="button" id="ideasTog" aria-expanded="true" aria-controls="starters"><svg class=ic aria-hidden=true><use href=#i-chevron></use></svg> Ideas <span class="n" id="ideasN"></span></button><button type="button" id="shuffle"><svg class=ic aria-hidden=true><use href=#i-dice></use></svg> Shuffle</button></div>
    <div class="ideas" id="starters" aria-label="Ideas to start"></div>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="compose">
    <textarea id="input" aria-label="Your message" placeholder="What should the story be about? e.g. two rivals get stuck sharing one wedding umbrella"></textarea>
    <div class="row"><span class="meta" id="meta">About 1 cent per reply.</span><button class="btn primary" id="send" type="button"><svg class=ic aria-hidden=true><use href=#i-pen></use></svg> Write</button></div>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// [genre, icon, name, one-line hook, prompt]. Six are shown at a time; "Mix" always has all four main genres.
const IDEAS=[
  ['romcom','heart','Wrong number','The text was meant for someone else','Write a rom-com where a text sent to the wrong number starts the best conversation of two people\'s week.'],
  ['romcom','coffee','Same coffee','Two strangers, one last order','Write a rom-com where two regulars fight over the last coffee every morning.'],
  ['romcom','wind','One umbrella','Rivals, one storm, one umbrella','Write a rom-com where two office rivals get stuck sharing one umbrella in a storm.'],
  ['romcom','link','Fake date','Just for one wedding','Write a rom-com about two friends who pretend to date for one family wedding.'],
  ['romcom','box','Parcel mix-up','The neighbour keeps getting yours','Write a rom-com about neighbours whose parcels keep getting swapped.'],
  ['romcom','mic','Karaoke night','The duet neither planned','Write a rom-com where two people who claim they cannot sing end up in a karaoke duet.'],
  ['comedy','laugh','One small lie','It needs a bigger one','Write a comedy where one tiny lie to a boss snowballs out of control.'],
  ['comedy','shirt','Job interview','Wearing the wrong thing','Write a comedy about a job interview where everything that can go wrong with an outfit does.'],
  ['comedy','wrench','Fix it myself','The tap had other plans','Write a comedy about someone who insists on fixing a leaking tap without help.'],
  ['comedy','surprised','Surprise party','Everyone forgot who it is for','Write a comedy about a surprise party that goes wrong because nobody told the planner whose it is.'],
  ['comedy','video','On mute','Or so they thought','Write a comedy about a work video call where someone believes they are muted.'],
  ['comedy','coffee','Diet day one','The office brought cake','Write a comedy about the first day of a diet when the whole office keeps bringing food.'],
  ['kids','sparkles','Shy little star','Afraid to shine','Write a kids story about a little star who is too shy to shine.'],
  ['kids','castle','Sock kingdom','Where lost socks go','Write a kids story about the kingdom where all the lost socks live.'],
  ['kids','leaf','Brave snail','The longest race ever','Write a kids story about a slow snail who enters a race and wins something better than first place.'],
  ['kids','flower','Talking garden','The flowers need help','Write a kids story about a girl who discovers her garden can talk when it is thirsty.'],
  ['kids','box','The big box','A rocket, a boat, a house','Write a kids story about two friends and one cardboard box that becomes anything.'],
  ['kids','moon','Sleepy moon','It forgot bedtime','Write a bedtime story for kids about a moon that cannot fall asleep.'],
  ['newgen','mic','Group chat','Someone left. At 2 AM','Write a new-gen story about the night someone suddenly leaves the friend group chat.'],
  ['newgen','video','Going viral','For the wrong video','Write a new-gen story about a student who goes viral for the video they almost deleted.'],
  ['newgen','zap','Side hustle','Day 1 versus day 30','Write a new-gen story about a side hustle started on a dare that actually takes off.'],
  ['newgen','help','Situationship','So what are we?','Write a new-gen story about finally asking what a situationship is.'],
  ['newgen','person','First job','Nobody taught this at college','Write a new-gen story about a first week at a first job, where the newest person solves the thing nobody else could.'],
  ['newgen','target','Delete the app','Seven days offline','Write a new-gen story about a week with all social apps deleted and what shows up in the quiet.'],
  ['thriller','hourglass','Ten minutes','Before the doors lock','Write a thriller where someone has ten minutes to get out of an office before it locks for the weekend with something inside.'],
  ['thriller','gem','Heist gone wrong','One of the crew is a fake','Write a heist thriller where the crew realises one of them is not who they say.'],
  ['thriller','link','Online stranger','The account knows too much','Write a thriller about an online stranger who knows things nobody was ever told.'],
  ['thriller','brain','Mind game','Trust no narrator','Write a psychological thriller where the narrator slowly realises they are the one being watched.'],
  ['suspense','lock','Locked room','No way in, no way out','Write a locked-room mystery with a clue hidden in the first line.'],
  ['suspense','target','One detail','Nobody noticed it','Write a mystery about one small detail nobody noticed.'],
  ['suspense','footprints','Tracks','They just stop','Write a mystery about footprints in the snow that stop in the middle of a field.'],
  ['horror','moon','Night shift','Something walks in at 3 AM','Write a horror story about something that happens on a night shift, with a twist at the end.'],
  ['horror','alert','Broken rule','"Never open the door after 2"','Write a horror story that opens with a strange rule the narrator broke.'],
  ['horror','camera','Found footage','The last file on the camera','Write a horror story told through the last video found on a missing hiker camera.'],
];
const MAIN=['romcom','comedy','kids','newgen'], GNAME={romcom:'Rom-com',comedy:'Comedy',kids:'Kids',newgen:'New gen',thriller:'Thriller',suspense:'Suspense',horror:'Horror'};
const NEON=['#ff7ad9','#ffb020','#c6ff00','#00e5ff','#b18cff','#ff4d6d'];
let shown=[];
const mixed=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function dealIdeas(){
  const g=$('genre').value;
  // not the ones on screen now, unless the genre is too small for that
  const of=f=>{ const all=IDEAS.map((_,i)=>i).filter(i=>f(IDEAS[i][0])), fresh=all.filter(i=>!shown.includes(i)); return mixed(fresh.length?fresh:all); };
  let pick;
  if(g==='mix'){ pick=MAIN.map(m=>of(x=>x===m)[0]); pick.push(of(x=>x==='thriller')[0], mixed(of(x=>MAIN.includes(x)).filter(i=>!pick.includes(i)))[0]); }
  else { pick=of(x=>x===g); if(pick.length<6) pick=pick.concat(mixed(IDEAS.map((_,i)=>i).filter(i=>IDEAS[i][0]===g&&!pick.includes(i)))); pick=pick.slice(0,6); }
  shown=pick.filter(i=>i!=null);
  $('starters').innerHTML=shown.map((k,p)=>{ const [gn,i,l,h]=IDEAS[k]; return `<button type="button" class="idea" style="--n:${NEON[p]};animation-delay:${p*40}ms" data-k="${k}">${ic(i)}<b>${l}</b><small><em>${GNAME[gn]}</em>${esc(h)}</small></button>`; }).join('');
}
// the list folds away; open by default until a chat starts, then the user's choice is remembered
function setIdeas(open, remember){
  $('starters').hidden=!open; $('shuffle').hidden=!open; $('ideasTog').setAttribute('aria-expanded',open);
  $('ideasN').textContent=open?'':IDEAS.length;
  if(remember) try{ localStorage.setItem('ideasOpen',open?'1':'0'); }catch{}
}
let msgs=[]; try{ msgs=JSON.parse(localStorage.getItem('scriptsChat')||'[]'); }catch{}
// copied text is plain text with normal spaces (no %20, non-breaking or zero-width spaces, no page styling)
const plain=t=>String(t).replace(/%20/g,' ').replace(/[  -   　]/g,' ').replace(/[​-‍⁠﻿]/g,'');
msgs=msgs.map(m=>({...m,content:plain(m.content)}));
document.addEventListener('copy',e=>{
  const sel=String(getSelection()||''); if(!sel||!e.clipboardData) return;
  e.clipboardData.setData('text/plain',plain(sel)); e.preventDefault();
});
// copy that works everywhere: the clipboard API first, then a hidden text box (iPhone home-screen app, in-app browsers)
async function copyText(text){
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch{}
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch{}
  ta.remove(); return ok;
}
const save=()=>{ try{ localStorage.setItem('scriptsChat',JSON.stringify(msgs.slice(-30))); }catch{} };
// A reply split into its parts, so the story reads on its own and the shot list sits apart. Also splits replies written
// the old way ("[0-3 s] line | VISUAL: what we see"). Returns null for anything that isn't a script (ideas, chat).
function parts(t){
  const head=[], story=[], visuals=[], foot=[]; let at='head';
  for(const raw of String(t).split('\n')){
    const l=raw.replace(/\*\*/g,'').trim(); if(!l) continue;
    if(/^(STORY|SCRIPT)\s*:/i.test(l)){ at='story'; continue; }
    if(/^VISUALS?\s*:\s*$/i.test(l)){ at='vis'; continue; }
    if(/^(ENDING|TWIST|TITLE IDEAS)\b[^:]*:/i.test(l)) at='foot';
    const beat=l.match(/^(\[[^\]]*\])\s*(.*)/);
    if(at==='story'){ const [line,see]=(beat?beat[2]:l).split(/\s*\|\s*VISUALS?\s*:\s*/i); story.push([beat?beat[1]:'',line]); if(see) visuals.push([beat?beat[1]:'',see]); }
    else if(at==='vis') visuals.push(beat?[beat[1],beat[2]]:['',l]);
    else (at==='foot'?foot:head).push(l);
  }
  return story.length?{head,story,visuals,foot}:null;
}
// only the spoken lines go to Story mode
function spoken(t){
  const x=parts(t); if(!x) return t;
  const hook=x.head.map(l=>l.match(/^HOOK[^:]*:\s*(.+)/i)).find(Boolean);
  const lines=[hook?hook[1]:'',...x.story.map(b=>b[1])].map(v=>v.trim().replace(/^["“]|["”]$/g,''));
  return lines.filter((v,i,a)=>v&&a.indexOf(v)===i).join('\n');
}
const beats=list=>list.map(([when,line])=>`<p>${when?`<span class="when">${esc(when.replace(/[\[\]]/g,''))}</span>`:''}<span>${esc(line)}</span></p>`).join('');
function readable(t){
  const x=parts(t); if(!x) return esc(t);
  const get=re=>x.head.map(l=>l.match(re)).find(Boolean)?.[1]||'';
  const title=get(/^TITLE\s*:\s*(.+)/i), genre=get(/^GENRE\s*:\s*(.+)/i);
  return `<div class="script">${title?`<h3>${esc(title)}</h3>`:''}${genre?`<span class="gtag">${esc(genre)}</span>`:''}
    <h4>Story</h4><div class="story">${beats(x.story)}</div>
    ${x.visuals.length?`<details><summary>Visuals · ${x.visuals.length} shot${x.visuals.length>1?'s':''}</summary><div class="shots">${beats(x.visuals)}</div></details>`:''}
    ${x.foot.length?`<div class="foot">${x.foot.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`:''}</div>`;
}
// while it types, only the story shows (the shot list would get in the way)
const typed=t=>{ const x=parts(t); return x?x.story.map(b=>b[1]).join('\n'):t; };
// the newest reply is typed out like someone writing it (a few seconds, however long it is); tap it to show it all
function typeOut(el, text){
  return new Promise(done=>{
    const body=el.querySelector('.txt'), tools=el.querySelector('.tools'), full=text; text=typed(full);
    const finish=()=>{ body.innerHTML=readable(full); };
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ finish(); return done(); }
    tools.hidden=true; el.classList.add('typing');
    const per=Math.max(1,Math.ceil(text.length/400)); let i=0, stop=false;
    el.onclick=()=>{ stop=true; };
    const step=()=>{
      i=stop?text.length:Math.min(text.length,i+per);
      body.textContent=text.slice(0,i);
      if(i<text.length) return requestAnimationFrame(step);
      el.classList.remove('typing'); el.onclick=null; tools.hidden=false; finish(); done();
    };
    step();
  });
}
// the "more of it" button fits the genre
const MORE={ mix:['Make it punchier','Rewrite it punchier: a stronger hook, tighter lines and a better payoff.'], romcom:['Make it sweeter','Rewrite it sweeter and wittier: better banter and a bigger "aww" at the end.'],
  comedy:['Make it funnier','Rewrite it funnier: bigger escalation, sharper punchlines and a callback at the end.'], kids:['Make it more fun','Rewrite it more fun for kids: a playful repeated line, more wonder and a warm happy ending.'],
  newgen:['More relatable','Rewrite it more relatable: truer to how young people talk and live now, without forced slang.'], thriller:['Raise the stakes','Rewrite it with higher stakes, a tighter ticking clock and a sharper final turn.'],
  suspense:['More mystery','Rewrite it with a deeper mystery: fairer clues and a more surprising reveal.'], horror:['Make it scarier','Rewrite it scarier: more dread and a nastier final line, with no gore.'] };
function render(typeLast){
  $('chat').innerHTML=msgs.length?msgs.map((m,i)=>`<div class="msg ${m.role}"><span class="txt">${typeLast&&i===msgs.length-1?'':m.role==='assistant'?readable(m.content):esc(m.content)}</span>${m.role==='assistant'?`<div class="tools"><button class="btn" data-story="${i}">${ic('film')} Use in Story mode</button><button class="btn" data-copy="${i}">${ic('check')} Copy</button><button class="btn" data-more="${i}">${(MORE[m.genre]||MORE.mix)[0]}</button><button class="btn" data-twist="${i}">Different ending</button></div>`:''}</div>`).join('')
    :'<div class="empty">Tap an idea or describe your own below.</div>';
}
async function send(text,genre){
  text=(text||'').trim(); if(!text||$('send').disabled) return; $('err').textContent='';
  // an idea or a rewrite keeps its own genre; typed requests use the Genre box
  genre=genre||$('genre').value;
  msgs.push({role:'user',content:text}); save(); render();
  $('chat').insertAdjacentHTML('beforeend','<div class="msg assistant thinking" id="thinking">Writing… (10-30 seconds)</div>');
  $('thinking').scrollIntoView({behavior:'smooth',block:'end'});
  $('send').disabled=true; $('input').value='';
  try{
    const r=await fetch('/api/scripts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,length:+$('len').value,format:$('fmt').value,genre})});
    const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'The writer failed, try again.');
    j.reply=plain(j.reply); msgs.push({role:'assistant',content:j.reply,genre}); save(); render(true);
    $('meta').textContent='Last reply cost '+(j.cost?'$'+j.cost.toFixed(4):'under a cent')+'.';
    const all=$('chat').querySelectorAll('.msg.assistant'), last=all[all.length-1];
    last?.scrollIntoView({behavior:'smooth',block:'start'});
    if(last) await typeOut(last,j.reply);
  }catch(e){ msgs.pop(); save(); render(); $('input').value=text; $('err').textContent=e.message; }
  $('send').disabled=false;
}
{ let saved=null; try{ saved=localStorage.getItem('ideasOpen'); }catch{} setIdeas(saved===null?!msgs.length:saved==='1'); }
$('ideasTog').onclick=()=>setIdeas($('starters').hidden,true);
$('shuffle').onclick=dealIdeas;
$('send').onclick=()=>send($('input').value);
$('input').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) send($('input').value); });
$('starters').onclick=e=>{ const b=e.target.closest('[data-k]'); if(b){ setIdeas(false); send(IDEAS[b.dataset.k][4],IDEAS[b.dataset.k][0]); } };
$('clear').onclick=()=>{ if(msgs.length&&!confirm('Start a new chat? This one will be cleared.')) return; msgs=[]; save(); render(); $('err').textContent=''; setIdeas(true,true); dealIdeas(); };
$('chat').onclick=async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.story){ try{ sessionStorage.setItem('scriptToStory',spoken(msgs[b.dataset.story].content)); }catch{} const sh=window.parent!==window&&window.parent.__shell; if(!(sh&&sh.go&&sh.go('/story',{reload:true}))) location.href='/story'; } // Story reloads so it picks up the script
  else if(b.dataset.copy){
    const ok=await copyText(plain(msgs[b.dataset.copy].content));
    if(ok) b.innerHTML=ic('check')+' Copied';
    else { // last resort: select the reply so the phone's own Copy works
      const t=b.closest('.msg').querySelector('.txt'), r=document.createRange(); r.selectNodeContents(t);
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Selected, tap Copy';
    }
  }
  else if(b.dataset.more){ const g=msgs[b.dataset.more].genre; send((MORE[g]||MORE.mix)[1],g); }
  else if(b.dataset.twist) send('Keep the setup, but give it a completely different, more surprising ending.',msgs[b.dataset.twist].genre);
};
try{ const o=JSON.parse(localStorage.getItem('scriptsOpts')||'{}'); if(o.len) $('len').value=o.len; if(o.fmt) $('fmt').value=o.fmt; if(o.genre) $('genre').value=o.genre; }catch{}
['len','fmt','genre'].forEach(id=>$(id).onchange=()=>{ try{ localStorage.setItem('scriptsOpts',JSON.stringify({len:$('len').value,fmt:$('fmt').value,genre:$('genre').value})); }catch{} if(id==='genre'){ shown=[]; dealIdeas(); } });
dealIdeas();
render();
</script>
<script src="/app.js"></script>
</body>
