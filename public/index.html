<title>Video Studio</title>
<style>
  :root{
    --bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:#232836;--text:#eceef4;--mute:#8a92a6;
    --acc:#7c5cff;--acc2:#b39bff;--ok:#34d399;--err:#ff6b6b;--warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 500px at 20% -10%,#1a1440 0,transparent 60%),var(--bg);color:var(--text);
    font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#ff7ab6);display:grid;place-items:center}
  .badge{font-size:12px;color:var(--mute);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
  .layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .panel+.panel{margin-top:18px}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:600}
  textarea{width:100%;min-height:200px;resize:vertical;background:var(--panel2);color:var(--text);border:1.5px dashed var(--line);
    border-radius:12px;padding:14px;font:inherit;line-height:1.55;outline:none;transition:.15s}
  textarea:focus{border-color:#3a3f55}
  textarea.over{border-color:var(--acc);background:#1a1830}
  .tools{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;gap:8px;flex-wrap:wrap}
  .count{color:var(--mute);font-size:12px}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .primary{width:100%;padding:14px;font-size:15px;background:linear-gradient(135deg,var(--acc),#9a6bff);border:0;color:#fff;border-radius:12px}
  .primary:hover:not(:disabled){filter:brightness(1.1);color:#fff;border:0}
  .models{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .model{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
  .model b{display:block}.model span{color:var(--mute);font-size:12px}
  .model.sel{border-color:var(--acc);background:#1a1830}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px;transition:.15s;user-select:none}
  .chip:hover{border-color:#3a3f55}
  .chip.sel{background:var(--acc);border-color:var(--acc);color:#fff}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:560px){.grid4{grid-template-columns:1fr 1fr}.models{grid-template-columns:1fr}}
  label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute)}
  select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;outline:none;width:100%}
  select:focus,input:focus{border-color:var(--acc)}
  .cost{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .cost b{color:var(--warn);font-size:16px}
  .err{color:var(--err);margin-top:10px;font-size:13px}
  .stage{display:grid;place-items:center;background:#07080c;border:1px solid var(--line);border-radius:14px;min-height:300px;overflow:hidden}
  .stage video{width:100%;max-height:560px;display:block;background:#000}
  .empty{color:var(--mute);text-align:center;padding:30px}
  .empty .big{font-size:40px;margin-bottom:6px}
  .prog{width:100%;padding:26px}
  .pct{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:14px 0 10px}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff7ab6);border-radius:99px;transition:width .6s}
  .meta{color:var(--mute);font-size:13px}
  .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  a.btn{text-decoration:none;display:inline-block}
  .fetch{display:flex;gap:8px}
  .hist{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
  .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}
  .item:hover{border-color:var(--acc)}
  .item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .item .s{color:var(--mute);font-size:11px;white-space:nowrap}
  .none{color:var(--mute);font-size:13px}
</style>

<script src="/studio.js"></script>
<script src="/theme.js"></script>
</head>
<body data-title="Single clip" data-sub="Turn one prompt into one video, with a live progress bar and cost estimate.">
<div class="wrap">
  <div class="layout">
    <div>
      <div class="panel">
        <h2>1 · Script / prompt</h2>
        <div id="tplBox"></div>
        <div class="ex-chips" id="examples" aria-label="Example prompts"></div>
        <label for="script" class="sr-only" style="position:absolute;left:-9999px">Prompt</label>
        <textarea id="script" maxlength="1000" placeholder="Drop a .txt file here, or type / paste your scene idea…&#10;&#10;Tip: write a rough idea, then press ✨ Enhance."></textarea>
        <div class="tools">
          <button class="btn" id="enh" type="button">✨ Enhance prompt</button>
          <span class="count" id="count" aria-live="polite">0 / 1000</span>
        </div>
        <h2>2 · Format</h2>
        <div class="chips" id="presets" aria-label="Presets"></div>
        <h2>3 · Model</h2>
        <div class="models" id="models" role="radiogroup" aria-label="Video model"></div>
        <h2>4 · Style</h2>
        <div class="meta" id="styleTheme" hidden style="margin-bottom:12px"></div>
        <div class="chips" id="styles"></div>
        <h2>5 · Settings</h2>
        <div class="grid4">
          <label id="durWrap">Duration<select id="duration" aria-describedby="modelNotes"></select></label>
          <label id="resWrap">Resolution<select id="resolution"></select></label>
          <label id="budgetWrap" hidden>Budget per clip ($)<input id="autoBudget" inputmode="decimal" value="0.50" aria-describedby="modelNotes"></label>
          <label>Aspect<select id="aspect"></select></label>
          <label id="audioWrap">Audio<select id="audio"><option value="true">On</option><option value="false">Off</option></select></label>
        </div>
        <div class="model-notes" id="modelNotes" aria-live="polite"></div>
        <div class="grid4" style="grid-template-columns:2fr 1fr 1fr">
          <label>Never show (negative prompt)<input id="negative" placeholder="e.g. text on screen, extra people, logos"></label>
          <label>Seed<input id="seed" inputmode="numeric" placeholder="Random" aria-describedby="seedNote"></label>
          <label style="flex-direction:row;align-items:center;gap:6px;align-self:end;color:var(--text)"><input type="checkbox" id="seedLock" style="width:auto"> Lock seed</label>
        </div>
        <label style="flex-direction:row;align-items:center;gap:8px;margin:-4px 0 12px;color:var(--text)"><input type="checkbox" id="quality" checked style="width:auto"> Quality booster <span class="meta" id="seedNote">(adds "sharp focus, natural motion, no warping, no extra fingers, no garbled text" for you)</span></label>
        <div class="grid4" style="grid-template-columns:1fr 3fr">
          <label>Variations<select id="variations"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
          <span class="meta" style="align-self:end">Make 2–3 versions at once (different seeds) and keep the best, instead of retrying one by one.</span>
        </div>
        <div class="cost"><span class="meta">Estimated total</span><b id="cost">—</b></div>
        <button class="btn primary" id="go" type="button">Generate video</button>
        <div class="err" id="err" role="alert"></div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>Result</h2>
        <div class="stage" id="stage"><div class="empty"><div class="big">🎞️</div>Your video and progress will show here.</div></div>
        <div class="actions" id="actions"></div>
      </div>
      <div class="panel">
        <h2>Fetch by job ID</h2>
        <div class="fetch"><input id="jobid" placeholder="gen-vid-…" aria-label="Job ID" aria-describedby="jobErr"><button class="btn" id="fetchjob" type="button">Fetch</button></div>
        <div class="field-err" id="jobErr" role="alert"></div>
      </div>
      <div class="panel">
        <h2>Recent jobs <a href="/history?kind=clip" style="float:right;text-transform:none;letter-spacing:0;color:var(--acc)">All history →</a></h2>
        <div class="hist" id="hist"></div>
      </div>
    </div>
  </div>
</div>
<script>
if(location.protocol==='file:'){location.replace('http://localhost:3100/');}
const $=id=>document.getElementById(id), S=window.studio;
const STYLES={
  movie:['🎥 Cinematic','Cinematic live-action movie style, shallow depth of field, dramatic lighting, smooth camera movement, film grain, high production value.'],
  kids:['🧸 Kids cartoon','Bright colorful 3D animated kids cartoon: cute round characters with big expressive eyes, soft glossy shading, cheerful saturated colors, simple friendly backgrounds, gentle playful motion.'],
  anime:['🌸 Anime','Japanese anime style, hand-drawn look, vivid colors, expressive eyes, dynamic camera angles, detailed painted backgrounds, cel shading.'],
  horror:['👻 Horror','Ultra-realistic cinematic horror, dark atmosphere, low-key dramatic lighting, suspenseful slow camera moves, realistic human expressions, no gore.'],
  pixar:['🎞️ 3D film','High-quality 3D animated feature-film style, expressive characters, warm lighting, rich textures, smooth animation.'],
  doc:['📹 Realistic','Realistic documentary footage, natural lighting, handheld camera feel, true-to-life colors and detail.'],
  comic:['✏️ 2D cartoon','Flat 2D hand-drawn animation like a TV cartoon episode, bold outlines, bright simple colors, lively exaggerated motion, one full-frame scene.'],
  none:['No style','']
};
const EXAMPLES=[
  ['☕ Coffee pour','Slow-motion close-up of hot coffee being poured into a glass mug on a sunny café table, steam curling up, the camera slowly pushes in.'],
  ['🏄 Surfer dog','A golden retriever rides a small wave on a surfboard at sunset, ears flapping, spray glittering, tracking shot from the water.'],
  ['🌃 Neon street','A woman in a yellow raincoat walks through a rainy neon-lit Tokyo street at night, reflections on the wet ground, slow dolly shot behind her.'],
];
// models shown here: cheapest first inside each tier
const SHOWN=['x-ai/grok-imagine-video-1.5-lite','google/veo-3.1-lite','bytedance/seedance-2.0-mini','alibaba/wan-3.0','google/gemini-omni-1.2-flash','google/veo-3.1-fast','kwaivgi/kling-v3.0-pro','bytedance/seedance-2.0'];
let seeds={}, MODELS={}, model=null, style=S.formValue('clip','style')||'movie', timers=[], showAll=false, autoEnhance={};
const LIMIT=1000;
const isAuto=()=>model===S.AUTO;
// in Auto mode the settings follow a sensible base model until the Director decides
const m=()=>isAuto()?MODELS['google/veo-3.1-lite']||Object.values(MODELS)[0]:MODELS[model];

function renderModels(){
  const card=(id)=>{const x=MODELS[id],r=x.res.includes('720p')?'720p':x.res[0];
    return `<div class="model ${id===model?'sel':''}" data-id="${id}" role="radio" tabindex="0" aria-checked="${id===model}"><b>${S.esc(x.name)}<span class="tier ${x.tier}">${S.tierLabel(x.tier)}</span></b><span>${S.money(S.rate(x,r,true),3)}/s @${r} · quality ${x.q}/10${x.route!=='openrouter'?' · via '+x.route:''}${x.note?' · '+S.esc(x.note):''}</span></div>`;};
  // every model the app can use: the usual ones first, the rest behind "More models", cheapest first in each tier
  const order={draft:0,regular:1,hero:2};
  const rest=Object.keys(MODELS).filter(id=>!SHOWN.includes(id)).sort((a,b)=>order[MODELS[a].tier]-order[MODELS[b].tier]||S.rate(MODELS[a],'720p')-S.rate(MODELS[b],'720p'));
  if(rest.includes(model)) showAll=true;
  $('models').innerHTML=`<div class="model auto ${isAuto()?'sel':''}" data-id="${S.AUTO}" role="radio" tabindex="0" aria-checked="${isAuto()}"><b>🧠 Auto<span class="tier hero">Director</span></b><span>Reads all ${Object.keys(MODELS).length} models and picks the best quality for your budget, with the process (picture first, Enhance)</span></div>`+
    SHOWN.filter(id=>MODELS[id]).map(card).join('')+(showAll?rest.map(card).join(''):'')+
    (rest.length?`<button type="button" class="btn" id="moreModels" style="grid-column:1/-1">${showAll?'Fewer models':'More models ('+rest.length+')'}</button>`:'');
  if($('moreModels')) $('moreModels').onclick=()=>{showAll=!showAll;renderModels();};
  $('models').querySelectorAll('.model').forEach(el=>{
    const pick=()=>{model=el.dataset.id;S.saveField('clip','model',model);applyModel();};
    el.onclick=pick; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}};
  });
}
function renderStyles(){
  $('styles').innerHTML=Object.entries(STYLES).map(([k,v])=>`<button type="button" class="chip ${k===style?'sel':''}" data-k="${k}" aria-pressed="${k===style}">${v[0]}</button>`).join('');
  $('styles').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{style=el.dataset.k;S.saveField('clip','style',style);renderStyles();});
}
function fill(sel,opts,def){const cur=sel.dataset.pending||sel.value; delete sel.dataset.pending; sel.innerHTML=opts.map(o=>`<option>${o}</option>`).join(''); sel.value=opts.includes(cur)?cur:def;}
function applyModel(){
  const x=m(); if(!x) return; renderModels();
  ['durWrap','resWrap'].forEach(id=>$(id).hidden=isAuto()); $('budgetWrap').hidden=!isAuto();
  if(isAuto()){ $('modelNotes').innerHTML='🧠 The Director chooses model, length, resolution, sound, picture first and Enhance for the best quality within your budget. You see its plan, its reasons and the total before anything is charged.'; updateCost(); return; }
  fill($('resolution'),x.res,x.res.includes('720p')?'720p':x.res[0]);
  [...$('resolution').options].forEach(o=>{if(o.value==='1080p') o.textContent='1080p (hero / YouTube only)';});
  fill($('aspect'),x.asp,'9:16');
  const cur=$('duration').dataset.pending||$('duration').value; delete $('duration').dataset.pending;
  $('duration').innerHTML=S.durOptions(x,x.durs.includes(+cur)?cur:'');
  if(x.audio==='always'||x.audio===false){$('audio').value=x.audio==='always'?'true':'false';}
  $('audioWrap').hidden=x.audio!==true;
  $('modelNotes').innerHTML=S.notesHTML(x);
  updateCost();
}
function updateCost(){
  const x=m(); if(!x) return;
  if(isAuto()){ const b=parseFloat($('autoBudget').value)||0; $('cost').textContent=`🧠 best quality within ${S.money(b)}${+$('variations').value>1?' per version':''} · plan and exact total shown before paying`; return; }
  const c=S.costLine(x,{res:$('resolution').value,dur:$('duration').value,audio:$('audio').value==='true',n:+$('variations').value});
  $('cost').textContent=c.text;
}
['duration','resolution','audio','variations'].forEach(i=>$(i).addEventListener('change',updateCost));

const ta=$('script');
const cnt=()=>{const n=ta.value.length;$('count').textContent=`${n} / ${LIMIT}`;$('count').className='count'+(n>=LIMIT?' over':n>LIMIT*.85?' near':'');};
ta.addEventListener('input',cnt);
['dragenter','dragover'].forEach(e=>ta.addEventListener(e,ev=>{ev.preventDefault();ta.classList.add('over')}));
['dragleave','drop'].forEach(e=>ta.addEventListener(e,ev=>{ev.preventDefault();ta.classList.remove('over')}));
ta.addEventListener('drop',async ev=>{
  const f=ev.dataTransfer.files[0];
  ta.value=(f?await f.text():ev.dataTransfer.getData('text')||'').slice(0,LIMIT); cnt(); ta.dispatchEvent(new Event('input'));
});
$('examples').innerHTML='<span class="meta" style="align-self:center">Try:</span>'+EXAMPLES.map((e,i)=>`<button type="button" data-i="${i}">${e[0]}</button>`).join('');
$('examples').onclick=e=>{const b=e.target.closest('button');if(!b)return;ta.value=EXAMPLES[b.dataset.i][1];cnt();ta.dispatchEvent(new Event('input'));};
S.templatePicker($('tplBox'),'clip',t=>{ta.value=t.prompt.slice(0,LIMIT);cnt();ta.dispatchEvent(new Event('input'));});
S.presetChips($('presets'),p=>{
  if(MODELS[p.model]){model=p.model;S.saveField('clip','model',model);}
  applyModel(); $('aspect').value=p.aspect; $('resolution').value=MODELS[model].res.includes(p.res)?p.res:$('resolution').value;
  // a 15–30 s Reel is several short clips: one clip here is the 4-8 s building block
  const d=MODELS[model].durs.filter(n=>n<=8).pop(); if(d) $('duration').value=d;
  ['aspect','resolution','duration'].forEach(i=>$(i).dispatchEvent(new Event('change')));
  window.toast&&toast(`${p.label}: ${MODELS[model].name}, ${$('resolution').value}, ${$('duration').value} s clips. Stitch several in Story mode for ${p.len} s.`);
});

// ---------- recent jobs (from the server's history, so they follow you across devices) ----------
async function renderHist(){
  let items=[];
  try{items=(await (await fetch('/api/history?kind=clip&limit=5')).json()).items||[];}catch{}
  $('hist').innerHTML=items.length?items.map(x=>`<div class="item" data-id="${x.id}" role="button" tabindex="0"><span class="t">${S.esc(x.title||x.id)}</span><span class="s">${x.status==='completed'?'✓':x.status==='failed'?'✗':'…'} ${x.cost!=null?S.money(x.cost)+' · ':''}${new Date(x.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="none">No clips yet. Your finished and running clips show here.</div>';
  $('hist').querySelectorAll('.item').forEach(el=>{el.onclick=()=>track(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter')track(el.dataset.id);};});
}

// ---------- progress ----------
function stopAll(){timers.forEach(clearInterval);timers=[];$('go').disabled=false;}
function resetStage(msg){
  $('stage').innerHTML=`<div class="empty"><div class="big">🎞️</div>${S.esc(msg||'Your video and progress will show here.')}</div>`;
}
function fail(msg){stopAll();resetStage('Nothing to show.');$('err').textContent=msg;}
function track(id){
  stopAll(); $('err').textContent=''; $('jobErr').textContent=''; $('actions').innerHTML='';
  $('jobid').value=id; $('stage').innerHTML=S.stageHTML({stage:'queued',msg:'Checking job…'});
  const t=setInterval(()=>poll(id),3000); timers.push(t); poll(id);
}
async function poll(id,cell){
  let j;
  try{const r=await fetch('/api/jobs/'+encodeURIComponent(id)); j=await r.json();
    if(!r.ok){ if(cell){cell.innerHTML=`<span class="err">${S.esc(j.error||'Poll failed')}</span>`;return 'stop';}
      if(r.status===404){stopAll();resetStage();$('jobErr').textContent=j.error||'No job with that ID.';return;}
      return fail(j.error||'Poll failed'); }}
  catch(e){ if(cell) return; return fail('Lost connection to server.'); }
  if(j.status==='failed'){ if(cell){cell.innerHTML=`<span class="err">Failed: ${S.esc(j.error||'unknown')}</span>`;return 'stop';} return fail('Generation failed: '+(j.error||'unknown')); }
  if(j.status!=='completed'){ (cell||$('stage')).innerHTML=S.stageHTML(j); return; }
  const cost=j.cost!=null?`${j.estimated?'≈ ':''}$${(+j.cost).toFixed(2)}${j.estimated?' (estimate)':''}`:'';
  if(cell){ cell.innerHTML=`<video controls playsinline loop muted src="${j.videoUrl}"></video><div class="meta">${cost}</div><button class="btn" type="button">Keep this one</button>`;
    cell.querySelector('button').onclick=()=>{document.querySelectorAll('.vcell').forEach(c=>c.classList.toggle('kept',c===cell));fetch('/api/history/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({kept:true})});
      $('actions').innerHTML=`<a class="btn" href="${j.videoUrl}?download=1">⬇ Download kept MP4</a>`;mountShare($('actions'),{url:j.videoUrl,name:'video-'+id.slice(-8)+'.mp4',prompt:ta.value});};
    renderHist(); window.dispatchEvent(new Event('spend-changed')); return 'stop'; }
  stopAll();
  $('stage').innerHTML=`<video controls autoplay loop playsinline src="${j.videoUrl}"></video>`;
  $('actions').innerHTML=`<a class="btn" href="${j.videoUrl}?download=1">⬇ Download MP4</a>`+(cost?`<span class="meta" style="align-self:center">Cost ${cost}</span>`:'')+
    (seeds[id]!=null?`<button class="btn" type="button" id="useSeed" title="Reuse this seed for the next clip">🎲 Seed ${seeds[id]} · reuse</button>`:'');
  if($('useSeed')) $('useSeed').onclick=()=>{ $('seed').value=seeds[id]; $('seedLock').checked=true; ['seed','seedLock'].forEach(k=>$(k).dispatchEvent(new Event('change'))); toast('Seed '+seeds[id]+' locked for the next clip'); };
  // the Director planned an upscale for this clip: start it straight away (free, on the server)
  const auto=autoEnhance[id]; delete autoEnhance[id];
  S.mountEnhance&&S.mountEnhance($('actions'),{src:j.videoUrl,auto});
  mountShare($('actions'),{url:j.videoUrl,name:'video-'+id.slice(-8)+'.mp4',prompt:ta.value});
  renderHist(); window.dispatchEvent(new Event('spend-changed'));
}

// ---------- generate ----------
$('go').onclick=async()=>{
  $('err').textContent=''; $('actions').innerHTML='';
  const text=ta.value.trim(); if(!text) return $('err').textContent='Write or drop a script first.';
  if(text.length>LIMIT) return $('err').textContent=`Keep the prompt under ${LIMIT} characters.`;
  if(!Object.keys(MODELS).length) return $('err').textContent='Models are still loading, try again in a moment.';
  $('go').disabled=true;
  if(isAuto()) return runAuto(text);
  const x=m();
  if(!$('duration').value){
    // Auto: the prompt writer picks a length (short clips drift less, so it chooses from the 8 s-or-shorter ones)
    $('stage').innerHTML=S.stageHTML({stage:'queued',msg:'Choosing the best length…'});
    const short=x.durs.filter(n=>n<=8), durs=short.length?short:x.durs;
    try{
      const r=await fetch('/api/enhance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,durations:durs,aspect_ratio:$('aspect').value,style:STYLES[style][1]})});
      const j=await r.json(); if(r.ok&&j.duration&&x.durs.includes(j.duration)) $('duration').value=j.duration;
    }catch{}
    if(!$('duration').value) $('duration').value=x.defaultDur;
    updateCost(); resetStage();
  }
  const n=+$('variations').value, audio=$('audio').value==='true';
  const c=S.costLine(x,{res:$('resolution').value,dur:$('duration').value,audio,n});
  const ok=await S.confirmSpend({title:n>1?`Make ${n} variations?`:'Make this video?',total:c.total,rows:[
    ['Model',x.name+' ('+S.tierLabel(x.tier)+')'],['Length',$('duration').value+' s'+(n>1?' × '+n:'')],['Resolution',$('resolution').value],['Aspect',$('aspect').value],
    ['Sound',x.audio===true?(audio?'On':'Off'):x.audio==='always'?'Always on':'None'],['Price',S.money(c.rate,3)+'/s'],['Theme',S.theme&&S.theme()?S.theme().name+' (locked)':'off']]});
  if(!ok){$('go').disabled=false;return;}
  const th=S.theme&&S.theme(), s=th?'':STYLES[style][1];
  const typed=parseInt($('seed').value,10), seed0=Number.isInteger(typed)?typed:Math.floor(Math.random()*2e9);
  if($('seedLock').checked) $('seed').value=seed0;
  const base={model,prompt:text+(s?' Visual style: '+s:''),title:text.slice(0,140),duration:+$('duration').value,resolution:$('resolution').value,aspect_ratio:$('aspect').value,generate_audio:audio,
    quality:$('quality').checked,negative:$('negative').value.trim()||undefined,seed:seed0};
  if(n===1){ $('stage').innerHTML=S.stageHTML({stage:'queued',msg:'Submitting…'}); }
  else $('stage').innerHTML=`<div class="var-grid">${Array.from({length:n},(_,i)=>`<div class="vcell" id="v${i}">${S.stageHTML({stage:'queued',msg:'Submitting…'})}</div>`).join('')}</div>`;
  return submitClips(base,n,text);
};
// sends n clips (variations get seed, seed+1…) and follows them
async function submitClips(base,n,text){
  const seed0=base.seed;
  try{
    const ids=[];
    for(let i=0;i<n;i++){
      const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...base,...(n>1?{seed:seed0+i,title:`${text.slice(0,120)} (v${i+1}, seed ${seed0+i})`}:{})})});
      const j=await r.json(); if(!r.ok){ if(!ids.length) return fail(j.error||'Request failed'); $('err').textContent=j.error; break; }
      if(j.note) window.toast&&toast(j.note);
      ids.push(j.id); seeds[j.id]=j.seed;
      if(autoEnhance.next){ autoEnhance[j.id]=autoEnhance.next; delete autoEnhance.next; }
    }
    window.dispatchEvent(new Event('spend-changed')); renderHist();
    if(n===1) return track(ids[0]);
    $('go').disabled=false;
    ids.forEach((id,i)=>{const cell=$('v'+i); const t=setInterval(async()=>{if(await poll(id,cell)==='stop')clearInterval(t);},3000); timers.push(t);});
  }catch(e){fail(e.message);}
}
// 🧠 Auto: ask the Director, show its plan (why, alternatives, total vs budget), then run that process
async function runAuto(text){
  const n=+$('variations').value, budget=parseFloat($('autoBudget').value)||undefined;
  const th=S.theme&&S.theme(), s=th?'':STYLES[style][1];
  $('stage').innerHTML=S.stageHTML({stage:'queued',msg:'🧠 The Director is reading all models and planning…'});
  let res;
  try{ res=await S.director({page:'clip',prompt:text+(s?' Visual style: '+s:''),aspect:$('aspect').value,budget,style:s||undefined}); }
  catch(e){ return fail(e.message); }
  window.dispatchEvent(new Event('spend-changed'));
  resetStage();
  const plan=await S.confirmPlan(res,{n,title:n>1?`Director’s plan for ${n} versions`:'Director’s plan'});
  if(!plan){ $('go').disabled=false; $('err').textContent=''; return; }
  const typed=parseInt($('seed').value,10), seed0=Number.isInteger(typed)?typed:Math.floor(Math.random()*2e9);
  if($('seedLock').checked) $('seed').value=seed0;
  const base={model:plan.model,prompt:text+(s?' Visual style: '+s:''),title:'🧠 '+text.slice(0,130),duration:plan.duration,resolution:plan.resolution,aspect_ratio:$('aspect').value,generate_audio:!!plan.audio,
    quality:$('quality').checked,negative:$('negative').value.trim()||undefined,seed:seed0};
  if(plan.pictureFirst){
    $('stage').innerHTML=S.stageHTML({stage:'queued',msg:'🖼 Drawing the first frame (picture first)…'});
    try{
      const r=await fetch('/api/still',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,aspect_ratio:$('aspect').value,style:s||undefined})});
      const j=await r.json(); if(!r.ok) throw new Error(j.error||'Picture failed');
      base.still_id=j.id;
    }catch(e){ toast('Picture first failed, making the clip from text: '+e.message,'err'); }
  }
  if(plan.enhance&&n===1) autoEnhance.next=plan.enhance;
  $('stage').innerHTML=S.stageHTML({stage:'queued',msg:`Submitting to ${(MODELS[plan.model]||{}).name||plan.model}…`});
  return submitClips(base,n,text);
}
$('enh').onclick=async()=>{
  $('err').textContent=''; const b=$('enh'); if(!ta.value.trim()) return $('err').textContent='Write a rough idea first.';
  b.disabled=true; b.textContent='Enhancing…';
  try{
    const r=await fetch('/api/enhance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:ta.value,duration:+$('duration').value||0,durations:m().durs,aspect_ratio:$('aspect').value,style:STYLES[style][1],max_words:150})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'Enhance failed');
    ta.value=j.prompt.slice(0,LIMIT); cnt(); ta.dispatchEvent(new Event('input'));
    if(j.duration&&m().durs.includes(j.duration)){ $('duration').value=j.duration; $('duration').dispatchEvent(new Event('change')); window.toast&&toast(`Length set to ${j.duration} s for this prompt`); }
  }catch(e){$('err').textContent=e.message;}
  b.disabled=false; b.textContent='✨ Enhance prompt';
};
$('fetchjob').onclick=()=>{
  const id=$('jobid').value.trim();
  if(!id) return $('jobErr').textContent='Paste a job ID first (it looks like gen-vid-…).';
  if(!S.validJobId(id)) return $('jobErr').textContent='That doesn\'t look like a job ID. It should look like gen-vid-… (letters, numbers and dashes).';
  track(id);
};
$('jobid').addEventListener('keydown',e=>{if(e.key==='Enter')$('fetchjob').click();});
$('jobid').addEventListener('input',()=>{$('jobErr').textContent='';});

// restore what was typed last time, then load models
S.persistForm('clip',['script','duration','resolution','aspect','audio','variations','negative','seed','seedLock','quality','autoBudget']);
if(!S.formValue('clip','autoBudget')) S.directorBudget('clip').then(b=>{ $('autoBudget').value=(+b).toFixed(2); updateCost(); });
$('autoBudget').addEventListener('input',updateCost);
$('autoBudget').addEventListener('change',()=>{ const v=Math.max(0.05,Math.min(50,parseFloat($('autoBudget').value)||0.5)); $('autoBudget').value=v.toFixed(2); updateCost(); });
// Theme Lock: the theme replaces the Style chips; choosing a theme also switches to its quality model
addEventListener('theme-changed',e=>{
  const t=e.detail.theme;
  $('styles').hidden=!!t; $('styleTheme').hidden=!t;
  if(t) $('styleTheme').innerHTML=`🔒 Style comes from the <b>${S.esc(t.name)}</b> theme (${S.esc([t.style,t.palette,t.lighting].filter(Boolean).join(' · ').slice(0,160))}). Turn Theme Lock off to pick a style here.`;
  if(t&&e.detail.picked&&t.models&&MODELS[t.models.good]){ model=t.models.good; S.saveField('clip','model',model); applyModel(); if([...$('resolution').options].some(o=>o.value===t.models.res)) $('resolution').value=t.models.res; updateCost(); }
});
cnt(); renderStyles(); renderHist();
S.models().then(({map,def})=>{
  MODELS=map; const saved=S.formValue('clip','model');
  model=saved===S.AUTO||MODELS[saved]?saved:MODELS[def]?def:SHOWN.find(id=>MODELS[id]);
  if(!model){$('err').textContent='Couldn\'t load the model list. Is the server running?';return;}
  applyModel();
});
</script>
