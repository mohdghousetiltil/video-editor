<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Studio</title>
<style>
  :root{
    --bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:#232836;--text:#eceef4;--mute:#8a92a6;
    --acc:#7c5cff;--acc2:#b39bff;--ok:#34d399;--err:#ff6b6b;--warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 500px at 20% -10%,#1a1440 0,transparent 60%),var(--bg);color:var(--text);
    font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#ff7ab6);display:grid;place-items:center}
  .badge{font-size:12px;color:var(--mute);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
  .layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .panel+.panel{margin-top:18px}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:600}
  textarea{width:100%;min-height:200px;resize:vertical;background:var(--panel2);color:var(--text);border:1.5px dashed var(--line);
    border-radius:12px;padding:14px;font:inherit;line-height:1.55;outline:none;transition:.15s}
  textarea:focus{border-color:#3a3f55}
  textarea.over{border-color:var(--acc);background:#1a1830}
  .tools{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;gap:8px;flex-wrap:wrap}
  .count{color:var(--mute);font-size:12px}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .primary{width:100%;padding:14px;font-size:15px;background:linear-gradient(135deg,var(--acc),#9a6bff);border:0;color:#fff;border-radius:12px}
  .primary:hover:not(:disabled){filter:brightness(1.1);color:#fff;border:0}
  .models{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .model{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
  .model b{display:block}.model span{color:var(--mute);font-size:12px}
  .model.sel{border-color:var(--acc);background:#1a1830}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13px;transition:.15s;user-select:none}
  .chip:hover{border-color:#3a3f55}
  .chip.sel{background:var(--acc);border-color:var(--acc);color:#fff}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:560px){.grid4{grid-template-columns:1fr 1fr}.models{grid-template-columns:1fr}}
  label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute)}
  select,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;outline:none;width:100%}
  select:focus,input:focus{border-color:var(--acc)}
  .cost{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
  .cost b{color:var(--warn);font-size:16px}
  .err{color:var(--err);margin-top:10px;font-size:13px}
  .stage{display:grid;place-items:center;background:#07080c;border:1px solid var(--line);border-radius:14px;min-height:300px;overflow:hidden}
  .stage video{width:100%;max-height:560px;display:block;background:#000}
  .empty{color:var(--mute);text-align:center;padding:30px}
  .empty .big{font-size:40px;margin-bottom:6px}
  .prog{width:100%;padding:26px}
  .pct{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:14px 0 10px}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff7ab6);border-radius:99px;transition:width .6s}
  .meta{color:var(--mute);font-size:13px}
  .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  a.btn{text-decoration:none;display:inline-block}
  .fetch{display:flex;gap:8px}
  .hist{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
  .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}
  .item:hover{border-color:var(--acc)}
  .item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .item .s{color:var(--mute);font-size:11px;white-space:nowrap}
  .none{color:var(--mute);font-size:13px}
</style>
<link rel="stylesheet" href="/app.css">
</head>
<body data-title="Single clip" data-sub="Turn one prompt into one video, with a live progress bar and cost estimate.">
<div class="wrap">
  <div class="layout">
    <div>
      <div class="panel">
        <h2>1 · Script / prompt</h2>
        <textarea id="script" placeholder="Drop a .txt file here, or type / paste your scene idea…&#10;&#10;Tip: write a rough idea, then press ✨ Enhance."></textarea>
        <div class="tools">
          <button class="btn" id="enh" type="button">✨ Enhance prompt</button>
          <span class="count" id="count">0 chars</span>
        </div>

        <h2>2 · Model</h2>
        <div class="models" id="models"></div>

        <h2>3 · Style</h2>
        <div class="chips" id="styles"></div>

        <h2>4 · Settings</h2>
        <div class="grid4">
          <label>Duration (s)<input id="duration" type="number" value="7"></label>
          <label>Resolution<select id="resolution"></select></label>
          <label>Aspect<select id="aspect"></select></label>
          <label>Audio<select id="audio"><option value="true">On</option><option value="false">Off</option></select></label>
        </div>

        <div class="cost"><span class="meta">Estimated cost</span><b id="cost">—</b></div>
        <button class="btn primary" id="go" type="button">Generate video</button>
        <div class="err" id="err"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>Result</h2>
        <div class="stage" id="stage"><div class="empty"><div class="big">🎞️</div>Your video and progress will show here.</div></div>
        <div class="actions" id="actions"></div>
      </div>
      <div class="panel">
        <h2>Fetch by job ID</h2>
        <div class="fetch"><input id="jobid" placeholder="gen-vid-…"><button class="btn" id="fetchjob" type="button">Fetch</button></div>
      </div>
      <div class="panel">
        <h2>Recent jobs</h2>
        <div class="hist" id="hist"></div>
      </div>
    </div>
  </div>
</div>

<script>
if(location.protocol==='file:'){location.replace('http://localhost:3100/'+(location.pathname.split('/').pop()==='index.html'?'':location.pathname.split('/').pop()));}

const $=id=>document.getElementById(id);

const MODELS={
  'bytedance/seedance-2.0-fast':{name:'Seedance 2.0 Fast',note:'Quality + audio · ~$0.04/s @480p',audio:true,min:4,max:15,
    res:['480p','720p'],asp:['9:16','16:9','1:1','4:3','3:4','21:9'],price:{'480p':.0425,'720p':.0912}},
  'x-ai/grok-imagine-video-1.5-lite':{name:'Grok Imagine 1.5 Lite',note:'Cheapest · ~$0.02/s @480p',audio:false,min:1,max:15,
    res:['480p','720p','1080p'],asp:['9:16','16:9','1:1','4:3','3:4','3:2','2:3'],price:{'480p':.02,'720p':.03,'1080p':.14}},
};
const STYLES={
  movie:['🎥 Cinematic','Cinematic live-action movie style, shallow depth of field, dramatic lighting, smooth camera movement, film grain, high production value.'],
  kids:['🧸 Kids cartoon','Bright colorful 3D animated kids cartoon in the style of CoComelon: cute round characters with big expressive eyes, soft glossy shading, cheerful saturated colors, simple friendly backgrounds, gentle playful motion.'],
  anime:['🌸 Anime','Japanese anime style, hand-drawn look, vivid colors, expressive eyes, dynamic camera angles, detailed painted backgrounds, cel shading.'],
  horror:['👻 Horror','Ultra-realistic cinematic horror, dark atmosphere, low-key dramatic lighting, suspenseful slow camera moves, realistic human expressions, no gore.'],
  pixar:['🎞️ 3D film','High-quality 3D animated feature-film style like Pixar, expressive characters, warm lighting, rich textures, smooth animation.'],
  doc:['📹 Realistic','Realistic documentary footage, natural lighting, handheld camera feel, true-to-life colors and detail.'],
  comic:['✏️ 2D cartoon','Flat 2D cartoon style, bold outlines, bright simple colors, lively exaggerated motion.'],
  none:['No style','']
};
let model='bytedance/seedance-2.0-fast', style='movie', timer=null;

function renderModels(){
  $('models').innerHTML=Object.entries(MODELS).map(([id,m])=>
    `<div class="model ${id===model?'sel':''}" data-id="${id}"><b>${m.name}</b><span>${m.note}</span></div>`).join('');
  $('models').querySelectorAll('.model').forEach(el=>el.onclick=()=>{model=el.dataset.id;applyModel();});
}
function renderStyles(){
  $('styles').innerHTML=Object.entries(STYLES).map(([k,v])=>`<div class="chip ${k===style?'sel':''}" data-k="${k}">${v[0]}</div>`).join('');
  $('styles').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{style=el.dataset.k;renderStyles();});
}
function fill(sel,opts,def){
  const cur=sel.value; sel.innerHTML=opts.map(o=>`<option>${o}</option>`).join('');
  sel.value=opts.includes(cur)?cur:def;
}
function applyModel(){
  const m=MODELS[model]; renderModels();
  fill($('resolution'),m.res,'480p'); fill($('aspect'),m.asp,'9:16');
  $('duration').min=m.min; $('duration').max=m.max;
  if(+$('duration').value<m.min) $('duration').value=m.min;
  if(+$('duration').value>m.max) $('duration').value=m.max;
  $('audio').disabled=!m.audio; updateCost();
}
function updateCost(){
  const p=MODELS[model].price[$('resolution').value]||0, d=+$('duration').value||0;
  $('cost').textContent=d?`≈ $${(p*d).toFixed(2)}`:'—';
}
['duration','resolution'].forEach(i=>$(i).addEventListener('input',updateCost));

const ta=$('script');
const cnt=()=>{$('count').textContent=ta.value.length+' chars'};
ta.addEventListener('input',cnt);
['dragenter','dragover'].forEach(e=>ta.addEventListener(e,ev=>{ev.preventDefault();ta.classList.add('over')}));
['dragleave','drop'].forEach(e=>ta.addEventListener(e,ev=>{ev.preventDefault();ta.classList.remove('over')}));
ta.addEventListener('drop',async ev=>{
  const f=ev.dataTransfer.files[0];
  if(f) ta.value=await f.text(); else { const t=ev.dataTransfer.getData('text'); if(t) ta.value=t; }
  cnt();
});

function getHist(){try{return JSON.parse(localStorage.getItem('jobs')||'[]')}catch{return[]}}
function saveHist(h){try{localStorage.setItem('jobs',JSON.stringify(h.slice(0,20)))}catch{}}
function addHist(id,text){const h=getHist().filter(x=>x.id!==id);h.unshift({id,text:text.slice(0,70),ts:Date.now()});saveHist(h);renderHist();}
function renderHist(){
  const h=getHist();
  $('hist').innerHTML=h.length?h.map(x=>`<div class="item" data-id="${x.id}"><span class="t">${(x.text||x.id).replace(/</g,'&lt;')}</span><span class="s">${new Date(x.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="none">No jobs yet.</div>';
  $('hist').querySelectorAll('.item').forEach(el=>el.onclick=()=>track(el.dataset.id));
}

function showProgress(p,msg){
  $('stage').innerHTML=`<div class="prog"><div class="pct">${p}%</div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="meta">${msg}</div></div>`;
}
function stop(){clearInterval(timer);timer=null;$('go').disabled=false;}
function fail(m){$('err').textContent=m;stop();}
function track(id){
  clearInterval(timer); $('err').textContent=''; $('actions').innerHTML='';
  $('jobid').value=id; showProgress(0,'Checking job…');
  timer=setInterval(()=>poll(id),3000); poll(id);
}
async function poll(id){
  let j;
  try{const r=await fetch('/api/jobs/'+id); j=await r.json(); if(!r.ok) return fail(j.error||'Poll failed');}
  catch(e){return fail('Lost connection to server.');}
  if(j.status==='failed') return fail('Generation failed: '+(j.error||'unknown'));
  if(j.status!=='completed'){
    const left=Math.max(5,Math.round(j.elapsed*(100-j.progress)/Math.max(j.progress,1)));
    return showProgress(j.progress,`${j.status==='pending'?'Queued at provider':'Generating'} · ${j.elapsed}s elapsed · ~${left}s left (estimate)`);
  }
  stop();
  $('stage').innerHTML=`<video controls autoplay loop src="${j.videoUrl}"></video>`;
  $('actions').innerHTML=`<a class="btn" href="${j.videoUrl}?download=1">⬇ Download MP4</a>`+(j.cost!=null?`<span class="meta" style="align-self:center">Cost $${j.cost}</span>`:'');
}

$('go').onclick=async()=>{
  $('err').textContent=''; $('actions').innerHTML='';
  const text=ta.value.trim(); if(!text) return $('err').textContent='Write or drop a script first.';
  $('go').disabled=true; showProgress(0,'Submitting to OpenRouter…');
  const s=STYLES[style][1];
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model,prompt:text+(s?' Visual style: '+s:''),duration:+$('duration').value,resolution:$('resolution').value,
      aspect_ratio:$('aspect').value,generate_audio:$('audio').value==='true'})});
    const j=await r.json(); if(!r.ok) return fail(j.error||'Request failed');
    addHist(j.id,text); track(j.id);
  }catch(e){fail(e.message);}
};
$('enh').onclick=async()=>{
  $('err').textContent=''; const b=$('enh'); b.disabled=true; b.textContent='Enhancing…';
  try{
    const r=await fetch('/api/enhance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      prompt:ta.value,duration:+$('duration').value,aspect_ratio:$('aspect').value,style:STYLES[style][1]})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||'Enhance failed');
    ta.value=j.prompt; cnt();
  }catch(e){$('err').textContent=e.message;}
  b.disabled=false; b.textContent='✨ Enhance prompt';
};
$('fetchjob').onclick=()=>{const id=$('jobid').value.trim(); if(id) track(id);};

renderStyles(); applyModel(); renderHist();
</script>
<script src="/app.js"></script>
</body>
</html>
