<!doctype html>
<html lang="en" data-shell>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-title" content="Video Studio">
<title>Video Studio</title>
<style>
  /* The shell: one page that never reloads. It owns the music (so it keeps playing between pages) and shows every
     page of the app in a full-screen frame. */
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;overscroll-behavior:none}
  /* The frame sits in a fixed box pinned to all four screen edges, exactly like the old bottom bar was; the pages are shown
     inside it at 100%. A fixed frame sized with width/height 100% stopped well short of the bottom edge on an iPhone
     home-screen app, leaving dead space under the tab bar. */
  #stage{position:fixed;top:0;right:0;bottom:0;left:0;background:#05060d}
  #app{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block;background:#05060d}
  /* measures the safe areas (notch, home bar): a frame may not be given them, so the pages ask for these numbers */
  #probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>
<script>
  // published to the pages inside the frame (same origin): the safe-area numbers, and where they report their address
  window.__shell = { insets: { t: 0, r: 0, b: 0, l: 0 }, page: function () {} };
</script>
</head>
<body data-shell>
<div id="probe"></div>
<div id="stage"><iframe id="app" title="Video Studio"
  allow="clipboard-write; clipboard-read; fullscreen; web-share; autoplay; camera; microphone; picture-in-picture"
  allowfullscreen></iframe></div>
<noscript>This app needs JavaScript. <a href="/?noshell">Open it without the frame</a>.</noscript>
<script src="/music.js"></script>
<script>
(function () {
  var frame = document.getElementById('app'), probe = document.getElementById('probe');
  function measure() {
    var c = getComputedStyle(probe), px = function (v) { return Math.round(parseFloat(v) || 0); };
    window.__shell.insets = { t: px(c.paddingTop), r: px(c.paddingRight), b: px(c.paddingBottom), l: px(c.paddingLeft) };
  }
  function push() { try { frame.contentWindow.postMessage({ shell: 'insets', insets: window.__shell.insets }, location.origin); } catch (e) {} }
  measure();
  addEventListener('resize', function () { measure(); push(); });
  addEventListener('orientationchange', function () { setTimeout(function () { measure(); push(); }, 300); });
  // a page reports its address and title: the address bar and the app switcher follow the page, not "/shell"
  window.__shell.page = function (url, title) {
    try { if (url && url !== location.pathname + location.search + location.hash) history.replaceState(null, '', url); } catch (e) {}
    if (title) document.title = title;
  };
  // /shell?to=/story opens that page (inside this site only)
  var to = new URLSearchParams(location.search).get('to') || '/';
  frame.src = /^\/(?![\/\\])/.test(to) ? to : '/';
  // the frame is given the box's real height in pixels (the box is pinned to the screen edges, so this is the whole screen)
  var stage = document.getElementById('stage');
  function fit() { var h = stage.getBoundingClientRect().height; if (h > 0) frame.style.height = Math.round(h) + 'px'; }
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  // The screen numbers: a small readout that says which shell version this is and where the frame ends. Turn it on with
  // /shell?debug, or from Settings > "Show screen numbers" (inside the home-screen app there is no address bar).
  var VERSION = 'shell 3', pre = null, timer = 0;
  function readout() {
    var r = frame.getBoundingClientRect(), st = stage.getBoundingClientRect(), c = frame.contentWindow, doc = c && c.document, tb = doc && doc.querySelector('.tabbar');
    var tr = tb ? tb.getBoundingClientRect() : null;
    pre.textContent = [VERSION, 'inner ' + innerWidth + 'x' + innerHeight, 'client ' + document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight, 'screen ' + screen.width + 'x' + screen.height,
      'insets ' + JSON.stringify(window.__shell.insets), 'stage ' + Math.round(st.top) + '..' + Math.round(st.bottom), 'frame ' + Math.round(r.top) + '..' + Math.round(r.bottom),
      'frame viewport ' + (c ? c.innerWidth + 'x' + c.innerHeight : '?'), 'tab bar ' + (tr ? Math.round(tr.top) + '..' + Math.round(tr.bottom) : '?'),
      '--sab ' + (doc ? doc.documentElement.style.getPropertyValue('--sab') || '(none)' : '?'),
      'home-screen app: ' + !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches))].join(String.fromCharCode(10));
  }
  window.__shell.debug = function (on) {
    if (on === undefined) on = !pre;
    if (on && !pre) {
      pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;z-index:2147483647;left:6px;top:calc(env(safe-area-inset-top,0px) + 6px);margin:0;padding:6px;background:rgba(0,0,0,.85);color:#7df3ff;font:11px/1.35 monospace;pointer-events:none;white-space:pre';
      document.body.appendChild(pre); readout(); timer = setInterval(readout, 1000);
    } else if (!on && pre) { clearInterval(timer); pre.remove(); pre = null; }
    try { localStorage.setItem('shellDebug', on ? '1' : '0'); } catch (e) {}
    return !!pre;
  };
  var wantDebug = /[?&]debug(=|&|$)/.test(location.search); try { wantDebug = wantDebug || localStorage.getItem('shellDebug') === '1'; } catch (e) {}
  if (wantDebug) window.__shell.debug(true);
})();
</script>
</body>
</html>
