<!doctype html>
<html lang="en" data-shell>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-title" content="VD0">
<title>VD0</title>
<style>
  /* The shell: one page that never reloads. It owns the music (so it keeps playing between pages) and shows every
     page of the app in a full-screen frame. */
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;overscroll-behavior:none}
  /* The frame sits in a fixed box pinned to all four screen edges, exactly like the old bottom bar was; the pages are shown
     inside it at 100%. A fixed frame sized with width/height 100% stopped well short of the bottom edge on an iPhone
     home-screen app, leaving dead space under the tab bar. */
  #stage{position:fixed;top:0;right:0;bottom:0;left:0;background:#05060d}
  #stage iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block;background:#05060d} /* every page's frame */
  /* measuring boxes (invisible): #vp is pinned to all four edges of the viewport, the others are 100vh / 100lvh / 100dvh tall */
  #vp,#vh,#lvh,#dvh{position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none}
  #vp{bottom:0}
  #vh{height:100vh}
  #lvh{height:100lvh}
  #dvh{height:100dvh}
  /* measures the safe areas (notch, home bar): a frame may not be given them, so the pages ask for these numbers */
  #probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>
<script>
  // published to the pages inside the frame (same origin): the safe-area numbers, and where they report their address
  window.__shell = { insets: { t: 0, r: 0, b: 0, l: 0 }, page: function () {} };
</script>
</head>
<body data-shell>
<div id="probe"></div>
<div id="vp" aria-hidden="true"></div>
<div id="vh" aria-hidden="true"></div><div id="lvh" aria-hidden="true"></div><div id="dvh" aria-hidden="true"></div>
<div id="stage"><iframe id="app" title="VD0"
  allow="clipboard-write; clipboard-read; fullscreen; web-share; autoplay; camera; microphone; picture-in-picture"
  allowfullscreen></iframe></div>
<noscript>This app needs JavaScript. <a href="/?noshell">Open it without the frame</a>.</noscript>
<script src="/music.js"></script>
<script>
(function () {
  var frame = document.getElementById('app'), probe = document.getElementById('probe');
  function measure() {
    var c = getComputedStyle(probe), px = function (v) { return Math.round(parseFloat(v) || 0); };
    window.__shell.insets = { t: px(c.paddingTop), r: px(c.paddingRight), b: px(c.paddingBottom), l: px(c.paddingLeft) };
  }
  function push() { try { frame.contentWindow.postMessage({ shell: 'insets', insets: window.__shell.insets }, location.origin); } catch (e) {} }
  measure();
  // An iPhone can report the notch / home-bar spacing as small or zero while the app is still starting, and the shell
  // never reloads. So the numbers are measured again a few times at launch, whenever a page finishes loading, and
  // whenever the phone could have changed them; the page is told only when they really changed.
  function remeasure() { var was = JSON.stringify(window.__shell.insets); measure(); if (JSON.stringify(window.__shell.insets) !== was) push(); if (window.__shell.fit) window.__shell.fit(); }
  [100, 400, 1000, 2500, 6000].forEach(function (t) { setTimeout(remeasure, t); });
  frame.addEventListener('load', function () { remeasure(); push(); setTimeout(remeasure, 300); });
  document.addEventListener('visibilitychange', remeasure); addEventListener('pageshow', remeasure); addEventListener('focus', remeasure);
  if (window.visualViewport) visualViewport.addEventListener('resize', remeasure);
  addEventListener('resize', function () { measure(); push(); });
  addEventListener('orientationchange', function () { setTimeout(function () { measure(); push(); }, 300); });
  // a page reports its address and title: the address bar and the app switcher follow the page, not "/shell"
  // (only the page on screen does; the ones kept in the background stay quiet)
  window.__shell.page = function (url, title, win) {
    if (win && frame && win !== frame.contentWindow) return;
    try { if (url && url !== location.pathname + location.search + location.hash) history.replaceState(null, '', url); } catch (e) {}
    if (title) document.title = title;
  };
  // ---- Pages stay alive between tabs: one frame per page. Changing tab hides the page you leave (it keeps running: what
  // you typed, uploaded pictures, open panels, jobs that are still being checked) and shows the other one, loading it only
  // the first time. A link that asks for different settings (/ugc?inf=…) or a page's own request reloads that page. ----
  var frames = {}, stageEl = document.getElementById('stage');
  var keyOf = function (url) { var u = new URL(url, location.href); return (u.pathname.replace(/\.html$/, '').replace(/^\/index$/, '/')) || '/'; };
  frames[keyOf(new URLSearchParams(location.search).get('to') || '/')] = frame;
  function show(f) {
    if (f === frame && f.style.display !== 'none') return;
    Object.keys(frames).forEach(function (k) { frames[k].style.display = frames[k] === f ? 'block' : 'none'; });
    frame = f; fit(); push();
    try {
      var w = f.contentWindow, d = w.document;
      window.__shell.page(w.location.pathname + w.location.search + w.location.hash, d.title, w);
      w.postMessage({ shell: 'shown' }, location.origin); // the page closes any menu it left open
    } catch (e) {}
  }
  window.__shell.active = function () { return frame.contentWindow; }; // the page on screen
  window.__shell.go = function (url, opts) {
    var u; try { u = new URL(url, location.href); } catch (e) { return false; }
    if (u.origin !== location.origin) return false;
    var k = keyOf(u.href), f = frames[k];
    if (!f) {
      f = document.createElement('iframe');
      f.title = 'VD0'; f.setAttribute('allow', frame.getAttribute('allow')); f.setAttribute('allowfullscreen', '');
      f.style.cssText = frame.style.cssText; f.className = frame.className; f.id = '';
      f.addEventListener('load', function () { if (f === frame) { remeasure(); push(); } });
      frames[k] = f; stageEl.appendChild(f); f.src = u.pathname + u.search + u.hash;
    } else {
      var cur = null; try { cur = f.contentWindow.location; } catch (e) {}
      var wantsNew = (opts && opts.reload) || (u.search && cur && u.search !== cur.search);
      if (wantsNew) f.src = u.pathname + u.search + u.hash;
      else if (u.hash && cur && u.hash !== cur.hash) { try { cur.hash = u.hash; } catch (e) {} }
    }
    show(f);
    return true;
  };
  // /shell?to=/story opens that page (inside this site only)
  var to = new URLSearchParams(location.search).get('to') || '/';
  frame.src = /^\/(?![\/\\])/.test(to) ? to : '/';
  // the frame is given the box's real height in pixels (the box is pinned to the screen edges, so this is the whole screen)
  var stage = document.getElementById('stage'), vp = document.getElementById('vp'), vhB = document.getElementById('vh'), lvhB = document.getElementById('lvh'), dvhB = document.getElementById('dvh');
  // How tall the app is. Normally that is the viewport the browser reports. On an iPhone home-screen app the viewport can
  // be shorter than the screen by exactly the top notch spacing (e.g. 879 of 926), which leaves dead space under the tab
  // bar. There (and only there: navigator.standalone exists only on iOS) the app takes the tallest of what the browser
  // offers, and the screen height when that is only a little taller.
  function fit() {
    var base = vp.getBoundingClientRect().height, H = base;
    if (navigator.standalone === true) {
      var best = Math.max(base, innerHeight, vhB.offsetHeight, lvhB.offsetHeight, dvhB.offsetHeight);
      var portrait = innerHeight >= innerWidth, scr = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      if (scr > best && scr - best <= 64) best = scr;
      H = best;
    }
    H = Math.round(H); window.__shell.height = H;
    if (H > 0) { stage.style.bottom = 'auto'; stage.style.height = H + 'px'; frame.style.height = H + 'px'; }
  }
  window.__shell.fit = fit; fit(); addEventListener('resize', fit); addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  // The screen numbers: a small readout that says which shell version this is and where the frame ends. Turn it on with
  // /shell?debug, or from Settings > "Show screen numbers" (inside the home-screen app there is no address bar).
  var VERSION = 'shell 5', pre = null, timer = 0;
  function readout() {
    var r = frame.getBoundingClientRect(), st = stage.getBoundingClientRect(), c = frame.contentWindow, doc = c && c.document, tb = doc && doc.querySelector('.tabbar');
    var tr = tb ? tb.getBoundingClientRect() : null;
    pre.textContent = [VERSION, 'inner ' + innerWidth + 'x' + innerHeight, 'client ' + document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight, 'screen ' + screen.width + 'x' + screen.height,
      'insets ' + JSON.stringify(window.__shell.insets), 'stage ' + Math.round(st.top) + '..' + Math.round(st.bottom), 'frame ' + Math.round(r.top) + '..' + Math.round(r.bottom),
      'vp box ' + Math.round(vp.getBoundingClientRect().height) + '  100vh ' + vhB.offsetHeight + '  lvh ' + lvhB.offsetHeight + '  dvh ' + dvhB.offsetHeight,
      'outer ' + outerHeight + '  visual ' + (window.visualViewport ? Math.round(visualViewport.height) + ' @' + Math.round(visualViewport.offsetTop) : '?') + '  app height ' + window.__shell.height,
      'frame viewport ' + (c ? c.innerWidth + 'x' + c.innerHeight : '?'), 'tab bar ' + (tr ? Math.round(tr.top) + '..' + Math.round(tr.bottom) : '?'),
      '--sat ' + (doc ? doc.documentElement.style.getPropertyValue('--sat') || '(none)' : '?') + '  --sab ' + (doc ? doc.documentElement.style.getPropertyValue('--sab') || '(none)' : '?'),
      'home-screen app: ' + !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches))].join(String.fromCharCode(10));
  }
  window.__shell.debug = function (on) {
    if (on === undefined) on = !pre;
    if (on && !pre) {
      pre = document.createElement('pre');
      pre.style.cssText = 'position:fixed;z-index:2147483647;left:6px;top:calc(env(safe-area-inset-top,0px) + 6px);margin:0;padding:6px;background:rgba(0,0,0,.85);color:#7df3ff;font:11px/1.35 monospace;pointer-events:none;white-space:pre';
      document.body.appendChild(pre); readout(); timer = setInterval(readout, 1000);
    } else if (!on && pre) { clearInterval(timer); pre.remove(); pre = null; }
    try { localStorage.setItem('shellDebug', on ? '1' : '0'); } catch (e) {}
    return !!pre;
  };
  var wantDebug = /[?&]debug(=|&|$)/.test(location.search); try { wantDebug = wantDebug || localStorage.getItem('shellDebug') === '1'; } catch (e) {}
  if (wantDebug) window.__shell.debug(true);
})();
</script>
</body>
</html>
