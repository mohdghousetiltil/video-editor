<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".28" cy=".18" r="1.05">
      <stop offset="0" stop-color="#21195a"/>
      <stop offset=".55" stop-color="#0b0f24"/>
      <stop offset="1" stop-color="#05060d"/>
    </radialGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="80" y1="80" x2="432" y2="432">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset=".55" stop-color="#4d7cff"/>
      <stop offset="1" stop-color="#ff2e93"/>
    </linearGradient>
    <linearGradient id="play" x1=".1" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#9ff7ff"/>
      <stop offset=".45" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity=".07" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <ellipse cx="256" cy="452" rx="260" ry="120" fill="url(#floor)"/>
  </g>
  <rect id="rim" x="5" y="5" width="502" height="502" rx="108" fill="none" stroke="url(#neon)" stroke-opacity=".55" stroke-width="10"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="url(#neon)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M104 172V114a10 10 0 0 1 10-10h58"/>
    <path d="M340 104h58a10 10 0 0 1 10 10v58"/>
    <path d="M408 340v58a10 10 0 0 1-10 10h-58"/>
    <path d="M172 408h-58a10 10 0 0 1-10-10v-58"/>
  </g>

  <!-- play button -->
  <path d="M214 176v160l128-80z" fill="url(#play)" stroke="url(#play)" stroke-width="34" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M222 196l26 16" stroke="#fff" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>
</svg>
